<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ PLATINUM CYBER SECURITY OVERLORD ACADEMY ⚡</title>
    <style>
        /* نظام الألوان والثيم السيبراني الداكن المتقدم - مخصص لحماية التصميم من الفشل */
        :root {
            --bg-main: #0a0f1d;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --primary: #3b82f6;
            --primary-neon: #00f0ff;
            --success: #10b981;
            --success-neon: #00ff87;
            --error: #ef4444;
            --error-neon: #ff0055;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.25s ease-in-out;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* رأس الصفحة الاحترافي */
        header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-bottom: 2px solid var(--primary-neon);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* نظام التبويبات الفوري والمتحرك */
        .tabs-container {
            max-width: 1200px;
            width: 100%;
            margin: 25px auto 0 auto;
            padding: 0 20px;
        }

        .tabs-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .tab-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            border-color: var(--primary-neon);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* حاوية الأقسام الرئيسية */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .tab-content {
            display: none; /* إخفاء الأقسام تلقائياً لمنع ظهورها تحت بعضها */
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .tab-content.active {
            display: block; /* إظهار القسم النشط فقط */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================================
        تنسيق قسم الموسوعة الضخم (قائمة جانبية + لوحة العرض)
        ========================================================================= */
        .encyclopedia-layout {
            display: grid;
            grid-template-columns: 320px 1px linear-gradient(to bottom, transparent, transparent);
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .encyclopedia-layout { grid-template-columns: 1fr; }
        }

        .sidebar-lessons {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .sidebar-title {
            color: var(--primary-neon);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-b: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .lesson-selector-btn {
            width: 100%;
            text-align: right;
            padding: 12px 15px;
            background-color: #1f2937;
            border: 1px solid transparent;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .lesson-selector-btn:hover, .lesson-selector-btn.active {
            background-color: #2d3748;
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .display-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            min-height: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .code-block {
            background-color: #05070f;
            border-left: 4px solid var(--primary-neon);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            color: #38bdf8;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            white-space: pre;
        }

        .remediation-box {
            background-color: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--success);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        /* =========================================================================
        تنسيق غرف الشات الذكية (Cyber Chatbot UI)
        ========================================================================= */
        .chatbot-card {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-header {
            background-color: #1e293b;
            padding: 15px 20px;
            border-b: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-display {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: rgba(10, 15, 29, 0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 1rem;
        }

        .chat-msg.bot {
            background-color: var(--bg-input);
            color: var(--text-main);
            border-right: 4px solid var(--primary-neon);
            align-self: flex-start;
        }

        .chat-msg.user {
            background-color: var(--primary);
            color: #ffffff;
            align-self: flex-end;
            border-left: 4px solid #ffffff;
        }

        .chat-input-area {
            padding: 15px;
            background-color: var(--bg-card);
            border-t: 1px solid var(--border);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-field {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .chat-input-field:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .chat-send-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-send-btn:hover {
            background-color: #059669;
            box-shadow: 0 0 12px var(--success-neon);
        }

        /* =========================================================================
        تنسيق بنك الاختبارات المتطور (Quiz UI)
        ========================================================================= */
        .quiz-card {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .neon-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 16px 40px;
