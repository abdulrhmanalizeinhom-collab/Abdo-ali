<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية الرهيبة</title>
    <style>
        /* إعدادات التصميم الأساسية والألوان العصرية */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --glow-color: rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--glow-color);
        }

        header p {
            color: #94a3b8;
        }

        /* شبكة بطاقات الإحصائيات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px var(--glow-color);
            border-color: var(--accent-color);
        }

        .card h3 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .card .value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .card .status {
            font-size: 0.9rem;
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* الزر التفاعلي السحري */
        .action-zone {
            margin-top: 40px;
            text-align: center;
            animation: fadeInUp 1.2s ease;
        }

        .mega-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mega-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }

        .mega-btn:active {
            transform: scale(0.95);
        }

        /* حركات الـ CSS (Animations) */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم المستقبل الذكية</h1>
        <p>تصميم متكامل يعتمد على تأثيرات التوهج والتفاعل اللحظي</p>
    </header>

    <!-- شبكة الإحصائيات الاستجابة -->
    <div class="grid-container">
        <div class="card">
            <h3>المستخدمين النشطين الآن</h3>
            <div class="value" id="users-count">1,240</div>
            <div class="status">▲ 12% منذ الساعة الماضية</div>
        </div>

        <div class="card">
            <h3>الأرباح الحالية</h3>
            <div class="value" id="revenue-count">$14,250</div>
            <div class="status" style="color: #3b82f6;">● تحديث فوري ومباشر</div>
        </div>

        <div class="card">
            <h3>سرعة استجابة الخادم</h3>
            <div class="value">94ms</div>
            <div class="status">✔ ممتاز (مستقر)</div>
        </div>
    </div>

    <!-- منطقة التفاعل التلقائي -->
    <div class="action-zone">
        <button class="mega-btn" id="boostBtn">تنشيط وضع الأداء الأقصى ⚡</button>
    </div>

    <script>
        // كود الجافا سكريبت لإضافة التفاعل الحي المحاكي للواقع
        const usersElement = document.getElementById('users-count');
        const boostButton = document.getElementById('boostBtn');

        // 1. محاكاة تحديث البيانات الحية تلقائياً كل ثانيتين
        setInterval(() => {
            let currentUsers = parseInt(usersElement.innerText.replace(',', ''));
            // توليد زيادة أو نقصان عشوائي بسيط
            let change = Math.floor(Math.random() * 21) - 10; 
            let newUsers = currentUsers + change;
            usersElement.innerText = newUsers.toLocaleString('en-US');
        }, 2000);

        // 2. زر تفاعلي يحدث تأثيراً عند الضغط عليه
        boostButton.addEventListener('click', () => {
            // تغيير واجهة المستخدم بشكل فوري ومبهر
            document.body.style.transition = 'background-color 0.5s';
            document.body.style.backgroundColor = '#1e1b4b'; // تغيير الخلفية للون داكن ملكي
            
            boostButton.innerText = "🚀 تم تفعيل السرعة القصوى!";
            boostButton.style.background = "linear-gradient(135deg, #10b981, #059669)";
            
            // زيادة الإحصائيات كدليل على التفاعل
            usersElement.innerText = (parseInt(usersElement.innerText.replace(',', '')) + 500).toLocaleString('en-US');
            
            // إعادة الوضع الطبيعي بعد 3 ثوانٍ
            setTimeout(() => {
                document.body.style.backgroundColor = '#0f172a';
                boostButton.innerText = "تنشيط وضع الأداء الأقصى ⚡";
                boostButton.style.background = "linear-gradient(135deg, #3b82f6, #8b5cf6)";
            }, 3000);
        });
    </script>

</body>
</html>
