<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأكاديمية المتقدمة للأمن السيبراني</title>
    <style>
        /* ثيم سيبراني داكن واحترافي ثابت ومدمج تماماً */
        :root {
            --bg-main: #0a0f1d;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --primary: #3b82f6;
            --primary-neon: #00f0ff;
            --success: #10b981;
            --success-neon: #00ff87;
            --error: #ef4444;
            --error-neon: #ff0055;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.2s ease-in-out;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            border-bottom: 2px solid var(--primary-neon);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-neon);
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 1rem;
        }

        .tabs-container {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto 0 auto;
            padding: 0 20px;
        }

        .tabs-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .tab-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn:hover {
            border-color: var(--primary-neon);
            color: #ffffff;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنسيق قسم الموسوعة */
        .encyclopedia-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .encyclopedia-layout { grid-template-columns: 1fr; }
        }

        .sidebar-lessons {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            height: fit-content;
        }

        .sidebar-title {
            color: var(--primary-neon);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .lesson-selector-btn {
            width: 100%;
            text-align: right;
            padding: 12px;
            background-color: #1f2937;
            border: 1px solid transparent;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .lesson-selector-btn:hover, .lesson-selector-btn.active {
            background-color: #2d3748;
            border-color: var(--primary-neon);
        }

        .display-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            min-height: 450px;
            line-height: 1.7;
        }

        .code-block {
            background-color: #05070f;
            border-left: 4px solid var(--primary-neon);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            color: #38bdf8;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            white-space: pre;
        }

        .remediation-box {
            background-color: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--success);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        /* تنسيق غرف الشات الذكية */
        .chatbot-card {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-header {
            background-color: #1e293b;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-display {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: rgba(10, 15, 29, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .chat-msg.bot {
            background-color: var(--bg-input);
            color: var(--text-main);
            border-right: 4px solid var(--primary-neon);
            align-self: flex-start;
        }

        .chat-msg.user {
            background-color: var(--primary);
            color: #ffffff;
            align-self: flex-end;
            border-left: 4px solid #ffffff;
        }

        .chat-input-area {
            padding: 15px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-field {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        .chat-send-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* تنسيق بنك الاختبارات */
        .quiz-card {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 35px;
            text-align: center;
        }

        .neon-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .quiz-option-btn {
            width: 100%;
            text-align: right;
            padding: 14px 18px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 10px;
            display: block;
        }

        .quiz-option-btn:hover {
            border-color: var(--primary-neon);
            background-color: #2d3748;
        }

        /* لوحة التحكم والرتب الإحصائية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-neon);
            margin-top: 8px;
        }

        .rank-container {
            margin-top: 30px;
            background: #111827;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .rank-title {
            font-size: 1.6rem;
            font-weight: 900;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛡️ الأكاديمية البلاتينية المتقدمة للأمن السيبراني 🛡️</h1>
        <p>موسوعة الهجوم المتقدم، تحليل البرمجيات الخبيثة، ونظام الرد التفاعلي الذكي</p>
    </header>

    <div class="tabs-container">
