<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مثال تفاعلي بسيط</title>
    
    <!-- هنا نكتب كود الـ CSS لتصميم الصفحة -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        .btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- هنا نكتب كود الـ HTML لبناء العناصر -->
    <h1>مرحباً بك في عالم تطوير الويب!</h1>
    <p>اضغط على الزر بالأسفل لتغيير لون الخلفية.</p>
    <button class="btn" id="colorBtn">غيّر اللون</button>

    <!-- هنا نكتب كود الـ JavaScript لإضافة التفاعل -->
    <script>
        const button = document.getElementById('colorBtn');
        
        button.addEventListener('click', function() {
            // توليد لون عشوائي
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        });
    </script>

</body>
</html>
