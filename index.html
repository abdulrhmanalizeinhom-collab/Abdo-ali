<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موسوعة Abdo_termux الضخمة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- الثيم الاحترافي التلقائي للموقع -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">جاري تحميل موسوعة عبده تيرمكس الأسطورية...</div>
  <script>
    window.$docsify = {
      name: '⚡ Abdo_termux Wiki',
      loadSidebar: true, // تشغيل القائمة الجانبية تلقائياً
      subMaxLevel: 2,
      // تفعيل محرك البحث الخارق التلقائي
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'ابحث عن أي أداة أو أمر هنا...',
        noData: 'عذراً، لم نجد نتائج مطابقة!',
        depth: 6
      }
    }
  </script>
  <!-- ملفات تشغيل البحث والليل والنهار تلقائياً بدون تعقيد -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
